plugins {
    id 'com.android.application'
}

Properties properties = new Properties()
properties.load(rootProject.file('local.properties').newDataInputStream())
def useLocalSdkCode = (properties.getProperty("use_local_sdk_code", "false") == "true")

// 如果是本地测试瑞雪的版本号，提测者自己更改，如果不用明确的话，直接写 ”本地测试“ 即可
def rxsdkVersionName = (useLocalSdkCode) ? "本地测试" : rootProject.ext.libraries.rxsdk_version

def libs = rootProject.ext.libraries // 库
android {
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.ruixue.sdk.demo.baidu"
        resValue "string", "app_name", "百度网讯 Sample"
        minSdkVersion rootProject.ext.minSdkVersion
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode rootProject.ext.versionCode
        versionName rxsdkVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        // 这里使用方可以更改成自己的签名进行测试
        byweilegame {
            keyAlias "weilegame"
            keyPassword "577588599"
            storeFile file("../keystore/weileGlobal.keystore")
            storePassword "577588599"
        }
        weilegame {
            v1SigningEnabled true
            v2SigningEnabled true

            keyAlias "weilegame"
            keyPassword "577588599"
            storeFile file("../keystore/weileHall.keystore")
            storePassword "577588599"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.weilegame
        }

        debug {
            //混淆
            minifyEnabled false
            //Zipalign优化
            zipAlignEnabled true
            // 移除无用的resource文件
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.weilegame
        }
    }
    buildFeatures {
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:${libs.appcompat}"
    implementation "androidx.constraintlayout:constraintlayout:${libs.constraintlayout}"
    implementation 'com.nex3z:flow-layout:1.3.3'
    implementation project(':app-core')

    // 渠道需要引用的库 使用方使用参考文档
    if (useLocalSdkCode) {
        api project(":channel:rxsdk_baidu_wangxun")
    } else {
        api "com.ruixue:rxsdk_baidu_wangxun:${libs.rxsdk_version}"
    }

}