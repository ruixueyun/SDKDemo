plugins {
    id 'com.android.application'
}

Properties properties = new Properties()
properties.load(rootProject.file('local.properties').newDataInputStream())
def useLocalSdkCode = (properties.getProperty("use_local_sdk_code", "false") == "true")

// 如果是本地测试瑞雪的版本号，提测者自己更改，如果不用明确的话，直接写 ”本地测试“ 即可
def rxsdkVersionName = (useLocalSdkCode) ? "本地测试" : rootProject.ext.libraries.rxsdk_version

def libs = rootProject.ext.libraries // 库
android {
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.tencent.tmgp.yueyang.syzj"
        resValue "string", "app_name", "应用宝 Sample"
        minSdkVersion rootProject.ext.minSdkVersion
        //noinspection ExpiredTargetSdkVersion
        versionCode 1004
        versionName "1000.0.4"
        targetSdkVersion 28
//        versionCode rootProject.ext.versionCode
//        versionName rxsdkVersionName

        manifestPlaceholders.put("QQ_APP_ID", "1112391268")
        manifestPlaceholders.put("WX_APP_ID", "wx266a7deac020e62c")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        // 这里使用方可以更改成自己的签名进行测试
        byweilegame {
            keyAlias "weilegame"
            keyPassword "577588599"
            storeFile file("../keystore/weileGlobal.keystore")
            storePassword "577588599"
        }
        weilegame {
            v1SigningEnabled true
            v2SigningEnabled true

            keyAlias "weilegame"
            keyPassword "577588599"
            storeFile file("../keystore/weileHall.keystore")
            storePassword "577588599"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.weilegame
        }

        debug {
            //混淆
            minifyEnabled false
            //Zipalign优化
            zipAlignEnabled true
            // 移除无用的resource文件
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.weilegame
        }
    }

    buildFeatures {
        viewBinding true
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation "androidx.appcompat:appcompat:${libs.appcompat}"
    implementation "androidx.constraintlayout:constraintlayout:${libs.constraintlayout}"
    implementation 'com.nex3z:flow-layout:1.3.3'
    implementation project(':app-core')

    if (useLocalSdkCode) {
        api project(':channel:rxsdk_ysdk')
        api project(':rxsdk_base')
        api project(':rxsdk_base_ui')
        api (project(':rxsdk_weixin')) {
            exclude group : 'com.tencent.mm.opensdk', module: 'wechat-sdk-android'
        }
    } else {
        api "com.ruixue:rxsdk_ysdk:${libs.rxsdk_version}"
        api "com.ruixue:rxsdk_base:${libs.rxsdk_version}"
        api "com.ruixue:rxsdk_base_ui:${libs.rxsdk_version}"
        api("com.ruixue:rxsdk_weixin:${libs.rxsdk_version}"){
            exclude group : 'com.tencent.mm.opensdk', module: 'wechat-sdk-android'
        }
    }
    // 应用宝渠道需要引用的库 使用方使用参考文档

}