plugins {
    id 'com.android.library'
}

Properties properties = new Properties()
properties.load(rootProject.file('local.properties').newDataInputStream())
def useLocalSdkCode = (properties.getProperty("use_local_sdk_code", "false") == "true")

def libs = rootProject.ext.libraries // 库
android {
    namespace 'com.ruixue.sdk.demo.main'
    compileSdk 34

    defaultConfig {
        minSdk 21

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.appcompat:appcompat:${libs.appcompat}"
    implementation "androidx.constraintlayout:constraintlayout:${libs.constraintlayout}"
    api 'com.nex3z:flow-layout:1.3.3'
    api 'com.github.gzu-liyujiang.AndroidPicker:Common:4.1.13'
    api 'com.github.gzu-liyujiang.AndroidPicker:WheelPicker:4.1.13'
    implementation 'com.github.HuanTanSheng:EasyPhotos:3.1.5'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation "io.github.cymchad:BaseRecyclerViewAdapterHelper4:4.1.4"
    implementation("com.github.bumptech.glide:glide:4.11.0") {
        exclude group: "com.android.support"
    }

    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    // 这里方便测试，因为不同渠道可能没引用到 ui 库，这里为了保证编译通过，增加了引用
    if (useLocalSdkCode) {
        implementation (project(':rxsdk_base_ui'))
        implementation (project(':rxsdk_base'))
        implementation (project(':rxsdk_h5pay'))
        implementation (project(':rxsdk_weixin_withpay'))
    } else {
        implementation "com.ruixue:rxsdk_base_ui:${libs.rxsdk_version}"
        implementation "com.ruixue:rxsdk_base:${libs.rxsdk_version}"
        implementation "com.ruixue:rxsdk_h5pay:${libs.rxsdk_version}"
    }
}